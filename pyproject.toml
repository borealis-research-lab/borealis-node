[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "borealis-node"
version = "0.1.0"
description = "Borealis Node: runs configured Borealis agents locally and combines their reports. Never performs detection."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Borealis Research contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "setuptools>=64"]

[project.scripts]
borealis-node = "borealis_node.cli:main"

[project.urls]
Repository = "https://github.com/borealis-research-lab/borealis-node"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
